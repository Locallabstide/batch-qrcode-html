<svg viewBox="0 0 680 560" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>二维码批量生成工具工作原理</title>
<desc>展示从两列数据输入，经浏览器本地生成二维码、套用样式，输出三种格式并打包 ZIP 的完整流程。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="560" fill="#ffffff"/>

<text x="40" y="30" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">二维码批量生成工具 · 工作流程</text>

<!-- 输入 -->
<g>
  <rect x="40" y="56" width="128" height="92" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="104" y="78" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">① 输入数据</text>
  <text x="104" y="100" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#185FA5" text-anchor="middle" dominant-baseline="central">名称, 内容（两列）</text>
  <text x="104" y="118" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#185FA5" text-anchor="middle" dominant-baseline="central">手输 / Excel / CSV</text>
  <text x="104" y="136" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#185FA5" text-anchor="middle" dominant-baseline="central">/ 粘贴</text>
</g>

<line x1="168" y1="102" x2="208" y2="102" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 生成内核 -->
<g>
  <rect x="208" y="56" width="128" height="92" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="272" y="78" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">② 生成矩阵</text>
  <text x="272" y="100" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#534AB7" text-anchor="middle" dominant-baseline="central">版本 1–40 自动选择</text>
  <text x="272" y="118" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#534AB7" text-anchor="middle" dominant-baseline="central">L / M / Q / H 容错</text>
  <text x="272" y="136" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#534AB7" text-anchor="middle" dominant-baseline="central">8 掩码自动择优</text>
</g>

<line x1="336" y1="102" x2="376" y2="102" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 样式 -->
<g>
  <rect x="376" y="56" width="128" height="92" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="440" y="78" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">③ 套用样式</text>
  <text x="440" y="100" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">尺寸 / 颜色 / 圆点样式</text>
  <text x="440" y="118" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">LOGO（≤25%）</text>
  <text x="440" y="136" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">上/下展示文字</text>
</g>

<line x1="504" y1="102" x2="544" y2="102" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 输出 -->
<g>
  <rect x="544" y="56" width="96" height="92" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="592" y="78" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">④ 导出</text>
  <text x="592" y="100" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#854F0B" text-anchor="middle" dominant-baseline="central">PNG / JPG</text>
  <text x="592" y="118" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#854F0B" text-anchor="middle" dominant-baseline="central">SVG（矢量）</text>
  <text x="592" y="136" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#854F0B" text-anchor="middle" dominant-baseline="central">打包 ZIP</text>
</g>

<!-- 本地边界 -->
<rect x="30" y="44" width="620" height="118" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
<text x="40" y="158" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">⬛ 全部在本机浏览器内完成 · 不上传 · 不联网</text>

<!-- QR 结构放大 -->
<text x="40" y="204" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">单个二维码的结构</text>

<g transform="translate(60,224)">
  <rect x="0" y="0" width="170" height="170" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <!-- 静区 -->
  <rect x="8" y="8" width="154" height="154" rx="2" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
  <!-- 三个定位角 -->
  <rect x="16" y="16" width="34" height="34" fill="#1f2430"/>
  <rect x="23" y="23" width="20" height="20" fill="#fff"/>
  <rect x="29" y="29" width="8" height="8" fill="#1f2430"/>
  <rect x="120" y="16" width="34" height="34" fill="#1f2430"/>
  <rect x="127" y="23" width="20" height="20" fill="#fff"/>
  <rect x="133" y="29" width="8" height="8" fill="#1f2430"/>
  <rect x="16" y="120" width="34" height="34" fill="#1f2430"/>
  <rect x="23" y="127" width="20" height="20" fill="#fff"/>
  <rect x="29" y="133" width="8" height="8" fill="#1f2430"/>
  <!-- 数据区示意 -->
  <g fill="#2f6bff" opacity="0.75">
    <rect x="60" y="18" width="9" height="9"/><rect x="78" y="18" width="9" height="9"/><rect x="96" y="18" width="9" height="9"/>
    <rect x="60" y="36" width="9" height="9"/><rect x="96" y="36" width="9" height="9"/>
    <rect x="60" y="60" width="9" height="9"/><rect x="78" y="60" width="9" height="9"/><rect x="114" y="60" width="9" height="9"/>
    <rect x="42" y="78" width="9" height="9"/><rect x="78" y="78" width="9" height="9"/><rect x="132" y="78" width="9" height="9"/>
    <rect x="60" y="96" width="9" height="9"/><rect x="114" y="96" width="9" height="9"/>
    <rect x="60" y="120" width="9" height="9"/><rect x="96" y="120" width="9" height="9"/><rect x="132" y="120" width="9" height="9"/>
    <rect x="78" y="138" width="9" height="9"/><rect x="114" y="138" width="9" height="9"/>
  </g>
  <!-- LOGO 中心 -->
  <rect x="70" y="70" width="30" height="30" rx="5" fill="#fff" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="85" y="85" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="9" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">LOGO</text>
</g>

<line x1="230" y1="290" x2="272" y2="290" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="278" y="266" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A" dominant-baseline="central">左上 / 右上 / 左下 = <tspan fill="#0C447C">定位角</tspan>（帮助扫描器定位）</text>
<text x="278" y="290" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A" dominant-baseline="central">外围虚线 = <tspan fill="#0C447C">静区</tspan>（留白，至少 4 模块宽，不可压缩）</text>
<text x="278" y="314" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A" dominant-baseline="central">蓝色小格 = <tspan fill="#2f6bff">数据与纠错码</tspan>（容错率越高占比越大）</text>
<text x="278" y="338" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A" dominant-baseline="central">中心方块 = <tspan fill="#0F6E56">LOGO</tspan>（≤25%，建议配 H 容错）</text>

<!-- 底部：容错率对照 -->
<text x="40" y="400" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">四档容错率对照</text>

<g font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="40" y="416" width="145" height="52" rx="8" fill="#f7f9fc" stroke="#e3e6ec" stroke-width="0.5"/>
  <text x="52" y="436" font-size="12.5" font-weight="600" fill="#2C2C2A">L · 低</text>
  <text x="52" y="455" font-size="11" fill="#6b7280">容错 ~7%　容量最大</text>

  <rect x="193" y="416" width="145" height="52" rx="8" fill="#f7f9fc" stroke="#e3e6ec" stroke-width="0.5"/>
  <text x="205" y="436" font-size="12.5" font-weight="600" fill="#2C2C2A">M · 中（默认）</text>
  <text x="205" y="455" font-size="11" fill="#6b7280">容错 ~15%　日常够用</text>

  <rect x="346" y="416" width="145" height="52" rx="8" fill="#f7f9fc" stroke="#e3e6ec" stroke-width="0.5"/>
  <text x="358" y="436" font-size="12.5" font-weight="600" fill="#2C2C2A">Q · 较高</text>
  <text x="358" y="455" font-size="11" fill="#6b7280">容错 ~25%　有轻微磨损</text>

  <rect x="499" y="416" width="145" height="52" rx="8" fill="#eef8f4" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="511" y="436" font-size="12.5" font-weight="600" fill="#085041">H · 最高</text>
  <text x="511" y="455" font-size="11" fill="#0F6E56">容错 ~30%　加 LOGO 用这档</text>
</g>

<text x="40" y="504" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">容错率越高，同样内容需要的模块越多、二维码越密，但被遮挡/磨损后仍能扫出。</text>
<text x="40" y="528" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">二维码内容生成后不可修改：需要改链接就重新生成一张。</text>
</svg>
